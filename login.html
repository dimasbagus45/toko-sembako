<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f1">
  <meta name="robots" content="noindex, nofollow">
  <title>Login Admin — Sembako Nusa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <script src="data.js" defer></script>
  <script src="login.js" defer></script>
</head>
<body class="admin-body">
  <main class="admin-auth">
    <a class="brand admin-auth-brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">n</span>
      <span class="brand-name">sembako<span>nusa</span></span>
    </a>
    <form class="login-card" id="login-form">
      <div class="eyebrow"><span aria-hidden="true">✳</span> AREA PENGELOLA TOKO</div>
      <h1>Selamat datang.</h1>
      <p class="login-description">Masuk untuk mengelola produk dan pengaturan toko.</p>
      <label class="admin-field">Nama pengguna
        <input name="username" autocomplete="username" required>
      </label>
      <label class="admin-field">Kata sandi
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-message" id="login-message" role="alert"></p>
      <button class="primary-button login-submit" type="submit">Masuk ke dashboard <span aria-hidden="true">↗</span></button>
    </form>
    <p class="auth-back"><a href="index.html">← Kembali ke toko</a></p>
  </main>
</body>
</html>
